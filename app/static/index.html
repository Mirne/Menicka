<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>Menu <span id="today" class="muted"></span></h1>
    <button id="refresh" class="ghost" data-i18n="refresh" data-i18n-title="refreshTitle">↻ Obnoviť menu</button>
  </header>

  <main>
    <section class="panel" id="vote-panel">
      <h2 data-i18n="question">Kam ideš na obed?</h2>
      <form id="vote-form">
        <div class="row">
          <label><span data-i18n="name">Meno</span><input id="vote-name" required maxlength="40" placeholder="Tvoje meno" data-i18n-placeholder="namePh" autocomplete="name"></label>
          <button type="button" id="vote-clear" class="ghost" data-i18n="clear">Zrušiť môj hlas</button>
        </div>
        <p class="choose muted" id="choose-label" data-i18n="choose">Vyber jednu alebo viac reštik</p>
        <div id="vote-choices" class="choices" role="group" aria-labelledby="choose-label"></div>
        <div id="other-details" hidden>
          <div class="row">
            <label class="grow"><span data-i18n="otherDetails">Kam konkrétne?</span><input id="other-note" maxlength="200" data-i18n-placeholder="otherPh" placeholder="Názov reštaurácie alebo miesto"></label>
          </div>
        </div>
      </form>
      <div id="tally" class="tally"></div>
    </section>

    <section id="menus" class="menus"><p class="muted" data-i18n="loading">Načítavam menu…</p></section>

  </main>
  <div id="toast" role="status"></div>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
