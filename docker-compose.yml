services:
  menicka:
    build: .
    ports:
      # host port: ./start.sh picks a free one and saves it to .env
      - "${PORT:-47823}:8000"
    environment:
      TZ: Europe/Prague
      REFRESH_MINUTES: "30"
    volumes:
      - menicka-data:/data
      # edit restaurants.yaml and restart, no rebuild needed
      - ./restaurants.yaml:/app/restaurants.yaml:ro
    restart: unless-stopped

volumes:
  menicka-data:
